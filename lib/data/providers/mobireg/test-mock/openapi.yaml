  /sso/{school}/{token}:
    get:
      operationId: pocztaSso
      summary: Poczta SSO login — returns redirect to establish session
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: string
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: SSO redirect
          headers:
            Location:
              schema:
                type: string
              example: "/"
            Set-Cookie:
              schema:
                type: string
              example: "session=mock-session-id; Path=/; HttpOnly"
        "200":
          description: Fallback for Prism static mock
          content:
            application/json:
              schema:
                type: object
              example:
                status: "ok"
                redirect: "/"
        "401":
          description: Invalid or expired SSO token
          content:
            application/json:
              schema:
                type: object
              example:
                status: "error"
                message: "Invalid SSO token"

