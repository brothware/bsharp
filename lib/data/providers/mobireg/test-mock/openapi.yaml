openapi: "3.1.0"
info:
  title: Mobireg Mock API
  version: "2.0.0"
  description: Mock of the mobireg.pl app API (auth.php, app.php) and the poczta mailbox.

servers:
  - url: http://localhost:8080

paths:
  /{school}/modules/api/auth.php:
    post:
      operationId: appLogin
      summary: Log in with the plaintext password
      parameters:
        - $ref: "#/components/parameters/school"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [login, password]
              properties:
                login:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: "`status` is `OK` with a token, or `ERROR` with a message"
          content:
            application/json:
              examples:
                success:
                  value:
                    status: OK
                    token: eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.mock
                    user: { id: 8256, login: user, role: 2 }
                invalidCredentials:
                  value:
                    status: ERROR
                    message: Nieprawidłowy login lub hasło

  /{school}/modules/api/app.php:
    post:
      operationId: appView
      summary: Read one view
      description: >-
        Views served by the mock are users, terms, subjects, marks,
        timetable-events, attendance-stats, tests, reprimands, announcements,
        notif-settings and register-fcm. Any other view answers errno 103.
      parameters:
        - $ref: "#/components/parameters/school"
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [view]
              properties:
                view:
                  type: string
                format:
                  type: string
                token:
                  type: string
                JWTToken:
                  type: string
                pupilId:
                  type: integer
                termId:
                  type: integer
                dateFrom:
                  type: string
                dateTo:
                  type: string
      responses:
        "200":
          description: Envelope with the view payload in `data`
          content:
            application/json:
              schema:
                type: object
                properties:
                  v:
                    type: integer
                  serverTime:
                    type: string
                  ttlFresh:
                    type: integer
                  ttlRetain:
                    type: integer
                  data: {}
        "401":
          description: Missing or invalid token
          content:
            application/json:
              example:
                status: ERROR
                message: Brak tokenu autoryzacji

  /sso/{school}/{token}:
    get:
      operationId: pocztaSso
      summary: Poczta sign-in
      parameters:
        - $ref: "#/components/parameters/school"
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Redirect that sets the session cookies
          headers:
            Set-Cookie:
              schema:
                type: string

  /api/unreadMessages:
    post:
      operationId: unreadMessages
      summary: Unread message count, no cookie needed
      responses:
        "200":
          description: Plain integer text
          content:
            text/plain:
              example: "1"

  /api/messages/{folder}:
    post:
      operationId: listMessages
      summary: List a folder (inbox, sent, important, trash)
      parameters:
        - name: folder
          in: path
          required: true
          schema:
            type: string
            enum: [inbox, sent, important, trash]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                limit:
                  type: integer
                skip:
                  type: integer
                query:
                  type: string
      responses:
        "200":
          description: Page of messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total:
                    type: integer
        "401":
          description: Missing session cookie

  /api/messages/read/{messageId}:
    get:
      operationId: readMessage
      summary: Read one message
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Message with HTML content
          content:
            application/json:
              schema:
                type: object

  /api/messages/receivers:
    post:
      operationId: receivers
      summary: Receiver types, or the receivers of one type
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                type:
                  type: string
      responses:
        "200":
          description: "`{types}` without a type, a list with one"
          content:
            application/json:
              schema: {}

  /api/messages/receivers/search:
    post:
      operationId: searchReceivers
      summary: Search receivers
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                ids:
                  type: array
                  items: {}
      responses:
        "200":
          description: List of receivers
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object

  /api/messages:
    put:
      operationId: sendMessage
      summary: Send a message
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                content:
                  type: string
                odbiorcy:
                  type: array
                  items:
                    type: string
                previousMessageId:
                  type: integer
      responses:
        "200":
          description: Id of the sent message
          content:
            application/json:
              example:
                id: 23001

  /api/messages/{messageId}:
    delete:
      operationId: deleteMessage
      summary: Move a message to the trash
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Ignored by the client

  /api/messages/{messageId}/stared:
    post:
      operationId: toggleStar
      summary: Toggle the star
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Ignored by the client

  /api/messages/{messageId}/restore:
    post:
      operationId: restoreMessage
      summary: Restore from the trash
      parameters:
        - $ref: "#/components/parameters/messageId"
      responses:
        "200":
          description: Ignored by the client

components:
  parameters:
    school:
      name: school
      in: path
      required: true
      schema:
        type: string
      example: osm-wroclaw
    messageId:
      name: messageId
      in: path
      required: true
      schema:
        type: integer
