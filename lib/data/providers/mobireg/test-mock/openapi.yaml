  /{school}/index.php:
    post:
      operationId: portalLogin
      summary: Portal login — returns 302 redirect with token in Location header
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: string
          example: osm-wroclaw
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                queryString:
                  type: string
                edlogin:
                  type: string
                edpass:
                  type: string
                resolutions:
                  type: string
      responses:
        "302":
          description: Redirect with token
          headers:
            Location:
              schema:
                type: string
              example: "https://rodzic.mobireg.pl/osm-wroclaw/a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
        "200":
          description: Fallback for Prism (static mock returns 200 with token in body)
          content:
            application/json:
              schema:
                type: object
              examples:
                loginSuccess:
                  summary: Successful login (Prism fallback with token)
                  value:
                    token: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6"
