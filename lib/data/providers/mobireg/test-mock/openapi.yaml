openapi: "3.1.0"
info:
  title: Mobireg Mock API
  version: "1.0.0"
  description: Mock server for mobireg.pl — mobile sync, portal, login, and poczta endpoints.

servers:
  - url: http://localhost:8080

paths:
  /{school}/modules/api/njson.php:
    post:
      operationId: mobileSync
      summary: Mobile sync endpoint
      parameters:
        - name: school
          in: path
          required: true
          schema:
            type: string
          example: osm-wroclaw
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                login:
                  type: string
                pass:
                  type: string
                device_id:
                  type: string
                app_version:
                  type: string
                parent_login:
                  type: string
                parent_pass:
                  type: string
                view:
                  type: string
                student_id:
                  type: string
                start_date:
                  type: string
                end_date:
                  type: string
                lmt:
                  type: string
                last_end_date:
                  type: string
                get_all_mark_groups:
                  type: string
      responses:
        "200":
          description: Sync data
          content:
            application/json:
              schema:
                type: object
              examples:
                invalidCredentials:
                  summary: Invalid credentials (errno 101)
                  value:
                    Err:
                      - errno: 101
                emptyParentStudents:
                  summary: ParentStudents with no students
                  value:
                    ParentStudents: []
                emptyMarks:
                  summary: Sync response with empty Marks array
                  value:
                    Students: []
                    Teachers: []
                    Subjects: []
                    Terms: []
                    Rooms: []
                    Events: []
                    EventTypes: []
                    EventTypeTeachers: []
                    EventTypeTerms: []
                    EventSubjects: []
                    EventEvents: []
                    Marks: []
                    MarkGroups: []
                    MarkKinds: []
                    MarkScales: []
                    MarkGroupGroups: []
                    Attendances: []
                    AttendanceTypes: []
                emptyEvents:
                  summary: Sync response with empty Events array
                  value:
                    Students: []
                    Teachers: []
                    Subjects: []
                    Terms: []
                    Rooms: []
                    Events: []
                    EventTypes: []
                    EventTypeTeachers: []
                    EventTypeTerms: []
                    EventSubjects: []
                    EventEvents: []
                    Marks: []
                    MarkGroups: []
                    MarkKinds: []
                    MarkScales: []
