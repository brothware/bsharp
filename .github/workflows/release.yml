name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.extract.outputs.version }}
      build_number: ${{ steps.extract.outputs.build_number }}
    steps:
      - name: Extract version from tag
        id: extract
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          VERSION="${TAG}"
          BUILD_NUMBER="$(echo "$TAG" | tr -d '.' | head -c 8)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Restore native assets
        id: native-assets
        uses: actions/cache/restore@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: flutter pub get

      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart run slang
      - run: dart format lib/l10n/

      - name: Archive generated files
        run: find lib -name '*.g.dart' -o -name '*.freezed.dart' | tar -czf generated-sources.tar.gz -T -

      - uses: actions/upload-artifact@v7
        with:
          name: generated-sources
          path: generated-sources.tar.gz
          retention-days: 1

      - run: dart format --set-exit-if-changed .
      - run: flutter analyze --fatal-warnings

      - name: Warm up native assets
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 15
          max_attempts: 3
          command: flutter test test/unit/core/result_test.dart

      - run: flutter test --coverage

      - name: Save native assets
        if: success() && steps.native-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

  build-web:
    runs-on: ubuntu-latest
    needs: [version, quality]
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Fetch dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: flutter pub get

      - uses: actions/download-artifact@v8
        with:
          name: generated-sources

      - run: tar -xzf generated-sources.tar.gz

      - name: Build web
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: flutter build web --base-href /bsharp/ --build-name=${{ needs.version.outputs.version }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: build/web

  build-android:
    runs-on: ubuntu-latest
    needs: [version, quality]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Restore native assets
        id: native-assets
        uses: actions/cache/restore@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: flutter pub get

      - uses: actions/download-artifact@v8
        with:
          name: generated-sources

      - run: tar -xzf generated-sources.tar.gz

      - name: Configure signing
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF

      - name: Build APK
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: flutter build apk --flavor phone --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Build AAB
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: flutter build appbundle --flavor phone --release --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-android-apk
          path: build/app/outputs/flutter-apk/app-phone-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: release-android-aab
          path: build/app/outputs/bundle/phoneRelease/app-phone-release.aab

      - name: Save native assets
        if: success() && steps.native-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

  build-ios:
    runs-on: macos-latest
    needs: [version, quality]
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}

      - name: Restore native assets
        id: native-assets
        uses: actions/cache/restore@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: flutter pub get

      - uses: actions/download-artifact@v8
        with:
          name: generated-sources

      - run: tar -xzf generated-sources.tar.gz

      - name: Build ios
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 45
          max_attempts: 3
          command: flutter build ios --release --no-codesign --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-ios
          path: build/ios/iphoneos/Runner.app

      - name: Save native assets
        if: success() && steps.native-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

  build-wearos:
    runs-on: ubuntu-latest
    needs: [version, quality]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          cache: true

      - name: Restore native assets
        id: native-assets
        uses: actions/cache/restore@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

      - name: Fetch dependencies
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: flutter pub get

      - uses: actions/download-artifact@v8
        with:
          name: generated-sources

      - run: tar -xzf generated-sources.tar.gz

      - name: Configure signing
        env:
          WEAR_KEYSTORE_BASE64: ${{ secrets.WEAR_KEYSTORE_BASE64 }}
          WEAR_KEY_ALIAS: ${{ secrets.WEAR_KEY_ALIAS }}
          WEAR_KEY_PASSWORD: ${{ secrets.WEAR_KEY_PASSWORD }}
          WEAR_STORE_PASSWORD: ${{ secrets.WEAR_STORE_PASSWORD }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        if: env.WEAR_KEYSTORE_BASE64 != '' || env.KEYSTORE_BASE64 != ''
        run: |
          if [ -n "$WEAR_KEYSTORE_BASE64" ]; then
            echo "$WEAR_KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=$WEAR_STORE_PASSWORD
          keyPassword=$WEAR_KEY_PASSWORD
          keyAlias=$WEAR_KEY_ALIAS
          storeFile=release.jks
          EOF
          else
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            cat > android/key.properties <<EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=release.jks
          EOF
          fi

      - name: Build WearOS APK
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: flutter build apk --flavor wear --release --target=lib/main_wear.dart --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - name: Build WearOS AAB
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 30
          max_attempts: 3
          command: flutter build appbundle --flavor wear --release --target=lib/main_wear.dart --build-name=${{ needs.version.outputs.version }} --build-number=${{ needs.version.outputs.build_number }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-wearos-apk
          path: build/app/outputs/flutter-apk/app-wear-release.apk

      - uses: actions/upload-artifact@v7
        with:
          name: release-wearos-aab
          path: build/app/outputs/bundle/wearRelease/app-wear-release.aab

      - name: Save native assets
        if: success() && steps.native-assets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .dart_tool/hooks_runner/shared
          key: native-assets-${{ runner.os }}-${{ github.job }}-${{ hashFiles('pubspec.lock') }}

  create-release:
    runs-on: ubuntu-latest
    needs: [version, build-web, build-android, build-ios, build-wearos]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package artifacts
        run: |
          cd artifacts
          mv release-android-apk/app-phone-release.apk bsharp-${{ needs.version.outputs.version }}.apk
          mv release-android-aab/app-phone-release.aab bsharp-${{ needs.version.outputs.version }}.aab
          mv release-wearos-apk/app-wear-release.apk bsharp-wear-${{ needs.version.outputs.version }}.apk
          mv release-wearos-aab/app-wear-release.aab bsharp-wear-${{ needs.version.outputs.version }}.aab
          tar -czf bsharp-web-${{ needs.version.outputs.version }}.tar.gz -C release-web .
          tar -czf bsharp-ios-${{ needs.version.outputs.version }}.tar.gz -C release-ios .

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s" --no-merges)
          else
            CHANGES=$(git log --pretty=format:"- %s" --no-merges -20)
          fi
          {
            echo "changes<<EOF"
            echo "$CHANGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: BSharp v${{ needs.version.outputs.version }}
          body: |
            ## BSharp v${{ needs.version.outputs.version }}

            ### Changes
            ${{ steps.changelog.outputs.changes }}

            ### Downloads
            - **Android APK** - `bsharp-${{ needs.version.outputs.version }}.apk`
            - **Android AAB** - `bsharp-${{ needs.version.outputs.version }}.aab` (Play Store)
            - **WearOS APK** - `bsharp-wear-${{ needs.version.outputs.version }}.apk`
            - **Web** - `bsharp-web-${{ needs.version.outputs.version }}.tar.gz`
            - **iOS** - `bsharp-ios-${{ needs.version.outputs.version }}.tar.gz` (unsigned)
          draft: true
          generate_release_notes: true

      - name: Attach the build artifacts
        uses: nick-fields/retry@v4
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          timeout_minutes: 20
          max_attempts: 3
          command: >-
            gh release upload v${{ needs.version.outputs.version }} --clobber
            artifacts/bsharp-${{ needs.version.outputs.version }}.apk
            artifacts/bsharp-${{ needs.version.outputs.version }}.aab
            artifacts/bsharp-wear-${{ needs.version.outputs.version }}.apk
            artifacts/bsharp-wear-${{ needs.version.outputs.version }}.aab
            artifacts/bsharp-web-${{ needs.version.outputs.version }}.tar.gz
            artifacts/bsharp-ios-${{ needs.version.outputs.version }}.tar.gz

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v${{ needs.version.outputs.version }} --draft=false

  deploy-play-wear:
    runs-on: ubuntu-latest
    needs: [version, build-wearos]
    if: vars.GOOGLE_PLAY_WEAR_ENABLED == 'true'
    concurrency:
      group: play-edit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-wearos-aab

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.brothware.bsharp
          releaseFiles: app-wear-release.aab
          tracks: wear:internal
          releaseName: v${{ needs.version.outputs.version }}
          status: completed

  # Both uploads edit the same Play app, and Play refuses to commit an edit if
  # the app changed while that edit was open. Waiting for the wear upload keeps
  # the two apart; the retry covers a wear release still landing underneath.
  deploy-play:
    runs-on: ubuntu-latest
    needs: [version, build-android, deploy-play-wear]
    if: >-
      always() && vars.GOOGLE_PLAY_ENABLED == 'true'
      && needs.version.result == 'success'
      && needs.build-android.result == 'success'
    concurrency:
      group: play-edit-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-android-aab

      - id: upload
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.brothware.bsharp
          releaseFiles: app-phone-release.aab
          tracks: internal
          releaseName: v${{ needs.version.outputs.version }}
          status: completed

      - name: Let the app settle before opening another edit
        if: steps.upload.outcome == 'failure'
        run: sleep 120

      - name: Upload again on a fresh edit
        if: steps.upload.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: pl.brothware.bsharp
          releaseFiles: app-phone-release.aab
          tracks: internal
          releaseName: v${{ needs.version.outputs.version }}
          status: completed

  deploy-proxy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        uses: nick-fields/retry@v4
        with:
          timeout_minutes: 10
          max_attempts: 3
          command: cd proxy && npx wrangler deploy

  deploy-pages:
    needs: build-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: release-web
          path: web-build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: web-build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
